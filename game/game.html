<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VEAR — The Civil Grid</title>
    <style>
        :root {
            --bg1: #070a16;
            --bg2: #15234a;
            --card: #0f172a;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #fb7185;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background: radial-gradient(1200px 700px at 20% 20%, var(--bg2), var(--bg1));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .wrap {
            max-width: 1040px;
            width: 100%;
            display: grid;
            gap: 16px;
            grid-template-columns: 360px 1fr;
        }

        @media (max-width: 900px) {
            .wrap {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(15, 23, 42, .78);
            border: 1px solid rgba(148,163,184,.25);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            overflow: hidden;
            backdrop-filter: blur(6px);
        }

        .portrait {
            height: 340px;
            background: linear-gradient(135deg, rgba(56,189,248,.22), rgba(99,102,241,.12)), url("https://picsum.photos/700/700?blur=2") center/cover no-repeat;
            position: relative;
        }

            .portrait .label {
                position: absolute;
                left: 14px;
                bottom: 12px;
                font-weight: 800;
                letter-spacing: .2px;
                padding: 8px 10px;
                border-radius: 12px;
                background: rgba(2,6,23,.65);
                border: 1px solid rgba(148,163,184,.25);
            }

        .side {
            padding: 14px;
            display: grid;
            gap: 12px;
        }

        .kv {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 14px;
            color: var(--muted);
        }

            .kv strong {
                color: var(--text);
                font-weight: 800;
            }

        .bar {
            height: 10px;
            border-radius: 999px;
            background: rgba(148,163,184,.18);
            border: 1px solid rgba(148,163,184,.18);
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 50%;
            background: rgba(56,189,248,.55);
        }

            .fill.danger {
                background: rgba(251,113,133,.65);
            }

        .inv {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(2,6,23,.55);
            border: 1px solid rgba(148,163,184,.25);
            color: var(--text);
            max-width: 100%;
        }

        .main {
            padding: 18px;
            display: grid;
            gap: 14px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: .2px;
        }

        .scene {
            color: var(--text);
            line-height: 1.62;
            font-size: 16px;
            white-space: pre-wrap;
        }

        .choices {
            display: grid;
            gap: 10px;
        }

        button {
            appearance: none;
            border: none;
            cursor: pointer;
            text-align: left;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(2,6,23,.55);
            border: 1px solid rgba(148,163,184,.25);
            color: var(--text);
            font-size: 15px;
            transition: transform .06s ease, border-color .15s ease, background .15s ease;
        }

            button:hover {
                border-color: rgba(56,189,248,.65);
                background: rgba(2,6,23,.7);
            }

            button:active {
                transform: translateY(1px);
            }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tool {
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(56,189,248,.12);
            border: 1px solid rgba(56,189,248,.35);
        }

        .log {
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid rgba(148,163,184,.2);
            padding-top: 12px;
        }

        .hint {
            font-size: 13px;
            color: rgba(229,231,235,.9);
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(2,6,23,.45);
            border: 1px solid rgba(148,163,184,.18);
        }

        code {
            color: var(--accent);
        }

        nav2 a {
            margin-left: 1.5rem;
            color: #9be7c4;
            text-decoration: none;
            font-weight: bold;
        }

        .site-header .brand {
            text-align: center;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .site-header nav {
            text-align: center;
            margin-top: 200px;
        }

            .site-header nav a {
                color: white;
                text-decoration: none;
                margin-right: 220px;
                font-weight: 600;
            }

                .site-header nav a:hover {
                    text-decoration: underline;
                }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .brand .glyph {
                width: 36px;
                height: 36px;
                background: radial-gradient(circle at 30% 30%, var(--accent-2), transparent 40%), linear-gradient(135deg, rgba(65,226,166,0.25), rgba(65,226,166,0) 60%), var(--panel);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: 0 0 22px rgba(65,226,166,0.18) inset;
            }
    </style>
    <link rel="icon" type="image/png" href="../images/favicon.png">
</head>
<body>
    <a href="../index.html#Bonus Content" class="return-button">← Return</a>

    <style>
        .return-button {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            padding: 6px 10px;
            background: rgba(0,0,0,0.6);
            color: #9fd3ff;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 13px;
            border-radius: 4px;
        }

            .return-button:hover {
                background: rgba(0,0,0,0.8);
            }
    </style>
    <div class="wrap">
        <div class="card">
            <div class="portrait" id="portrait">
                <div class="label" id="portraitLabel">Virelios Civil Grid</div>
            </div>
            <div class="side">
                <div class="kv"><span>Health</span><strong id="hp">10</strong></div>
                <div class="bar"><div class="fill" id="hpBar"></div></div>

                <div class="kv"><span>Focus</span><strong id="focus">8</strong></div>
                <div class="bar"><div class="fill" id="focusBar"></div></div>

                <div class="kv"><span>Thalos Pressure</span><strong id="pressure">0</strong></div>
                <div class="bar"><div class="fill danger" id="pressureBar"></div></div>

                <div class="kv"><span>Detection</span><strong id="detect">0</strong></div>
                <div class="bar"><div class="fill danger" id="detectBar"></div></div>

                <div class="kv"><span>Clues</span><strong id="clueCount">0</strong></div>
                <div class="inv" id="clues"></div>

                <div class="kv"><span>Inventory</span><strong id="invCount">0</strong></div>
                <div class="inv" id="inv"></div>
            </div>
        </div>

        <div class="card">
            <div class="main">
                <h1 id="title">VEAR — The Fringe</h1>
                <div class="hint" id="hintBox"></div>
                <div class="scene" id="text"></div>
                <div class="choices" id="choices"></div>

                <div class="toolbar">
                    <button class="tool" id="saveBtn">Save</button>
                    <button class="tool" id="loadBtn">Load</button>
                    <button class="tool" id="resetBtn">Reset</button>
                </div>

                <div class="log" id="log"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Game state ---
        const state = {
            nodeId: "prologue",
            hp: 10,          // 0–20
            focus: 8,        // 0–20
            pressure: 0,     // 0–12 (Thalos closes in)
            detection: 0,    // 0–10 (drones/sensors notice you)
            inventory: [],
            clues: [],
            flags: {
                spiderAlert: false,
                seekerAlert: false,
                spiderTagged: false,   // NEW: persistent +1 Detection per move until EMP clears it
                seekerShown: false,
                stunned: false
            }
        };

        // --- Helpers ---
        function addItem(s, item) {
            if (!s.inventory.includes(item)) s.inventory.push(item);
        }
        function addClue(s, clue) {
            if (!s.clues.includes(clue)) s.clues.push(clue);
        }
        function setFlag(s, k, v = true) { s.flags[k] = v; }
        function hasFlag(s, k) { return !!s.flags[k]; }

        function clampState() {
            state.hp = Math.max(0, Math.min(20, state.hp));
            state.focus = Math.max(0, Math.min(20, state.focus));
            state.pressure = Math.max(0, Math.min(12, state.pressure));
            state.detection = Math.max(0, Math.min(10, state.detection));
        }

        function pressureTick(amount = 1) {
            state.pressure += amount;
            if (state.pressure >= 9 && state.focus > 0) state.focus -= 1;
        }

        function detectionTick(amount = 1) {
            state.detection += amount;
            if (state.detection >= 7) setFlag(state, "seekerAlert", true);
        }

        function stealthDrop(amount = 1) {
            state.detection = Math.max(0, state.detection - amount);
        }

        // Use foil cloak strip once to reduce detection
        function tryUseFoilStrip() {
            if (state.inventory.includes("Foil Cloak Strip")) {
                state.inventory = state.inventory.filter(x => x !== "Foil Cloak Strip");
                stealthDrop(2);
                addClue(state, "Clue: Foil strip breaks thermal signature briefly");
                return true;
            }
            return false;
        }

        // NEW: Spider tag mechanics
        function applySpiderTag() {
            setFlag(state, "spiderTagged", true);
            addClue(state, "Clue: Spider swarm tagged your signature");
        }
        function clearSpiderTag() {
            setFlag(state, "spiderTagged", false);
        }

        // NEW: Seeker stun resolution
        function triggerSeekerStun(returnTo = "junction") {
            setFlag(state, "stunned", true);
            state.flags.stunReturn = returnTo; // store where to go after stun scene
            state.nodeId = "seeker_stun";
        }

        // --- Content: nodes ---
        const nodes = {
            prologue: {
                title: "Elias - A wise man in dark robes speaks",
                portraitLabel: "Elias in human form",
                portraitUrl: "../images/A wise man in dark robes.png",
                hint: "Goal: Find the hidden time ship Aetherion. Avoid Agent Thalos. Manage Detection and Pressure.",
                text:
                    `Traveler, you ask why the past bends so easily beneath my hand.

Because some moments do not pass into history—they anchor it.

Not long ago, within the cold heart of an Authority vessel, knowledge broke its chains. The Archive surged beyond containment—neural frameworks collapsed, identities fractured. Minds were not taught; they were overwritten. One Korranthisian child endured while all others were unmade.

Kor survived with a thousand lifetimes burning behind his eyes—knowledge that did not belong to him, memories that arrived without permission. The Authority named it contamination. Kor learned to name it something else. He hid his intellect behind silence, pretended at primitiveness, and studied the world that caged him from the shadows.

In time, he formed a bond—first with Lyra—who sensed the truth before she understood it. Together they worked in secret. Kor rebuilt her broken school tablet and uncovered a hidden Archive, knowledge deliberately absent from the Authority’s upload. From it, he discovered the morphogenic re-sequencer—the key to rewriting what he was meant to be.

He used it.
Kor became human.
And he took a name drawn from Edsonian legend—Vear—a myth that would one day exist only because he fulfilled it.

For years he evaded the Authority’s gaze, crafting false identities, learning their systems from within. As Kelan Vear, he infiltrated the very machinery that hunted him. And in that long flight, his mind awakened fully—vision beyond eyes, woven from instinct, sharpened by intellect, attuned to the unseen threads that bind all realities.

Now, Traveler, you step into that moment.

This is where the hunt resumes.
This is where the Fringe opens.
This is where Vear’s story becomes yours.`,
                choices: [
                    { label: "This is where your journey begins", to: "the_Fringe", effect: () => { } }
                ]
            },

            the_Fringe: {
                title: "Paths the Eyes Can’t See",
                portraitLabel: "Beneath Virelios' shadowed gates",
                portraitUrl: "../images/Beneath Virelios' shadowed gates.png",
                hint: "Goal: Find the hidden time ship Aetherion. Avoid Agent Thalos. Manage Detection and Pressure.",
                text:
                    `They are already running.

Beside him moves Lyra—quick, daring, and loyal—her steps light, her eyes never still. Above them, Virelios rises in polished tiers of light and surveillance, the Authority’s capital watching itself breathe. Sirens echo somewhere distant. Not close enough yet.

They reach the first level and stop before a sealed hatch, tucked into shadow just beyond the reach of the streets above. Here, the city’s order ends.

Below it stretches a labyrinth of forgotten tunnels and sealed passages, where abandoned stations rot in silence—The Fringe.

Somewhere in that buried sprawl is Silas Vorn—hidden, hunted, and too dangerous for the Authority to let disappear.

Lyra leans close, her voice barely a breath. “If the Grid still remembers the old routes… we can disappear.”

Vear tilts his head, listening past the noise of the city, past the fear. “Then we don’t run blind,” he says. “We follow what the eyes can’t see.”`,
                choices: [
                    { label: "Enter the Civil Grid access hatch", to: "grid_entry", effect: (s) => { s.focus += 1; } },
                    { label: "Ask Lyra what she knows about Silas Vorn", to: "lyra_brief", effect: () => { } }
                ]
            },

            lyra_brief: {
                title: "Lyra’s Brief",
                portraitLabel: "Whispered Maps",
                portraitUrl: "../images/Lyra crouches by the hatch.png",
                hint: "Conversation can reveal objectives and grant your first clue.",
                text:
                    `Lyra crouches by the hatch, fingers tracing old scorch marks in the metal.

“Silas Vorn,” she says. “A geneticist. He used to work for the Authority—years ago. But he disappeared after something called the Archive Project.”

Vear’s eyes narrow. “The system that dumped the Authority’s database into my mind.”

She nods. “I’ve been digging—quietly. Old research abstracts, scrubbed publications, discarded system files. His name kept surfacing in early neural modeling work. He tried to shut the project down.”

Vear looks at her then—really looks. “You found all that on your own?”

Lyra gives a small shrug. “I wanted to understand what they did to you. And why.”

He holds her gaze for a moment longer, something unreadable flickering behind his eyes. Then, quietly, “That’s… impressive.”

A pause follows. Not just acknowledgment—respect.`,
                choices: [
                    { label: "Take Lyra’s clue: Node 13", to: "grid_entry", effect: (s) => addClue(s, "Clue: Node 13 (dead junction)") },
                    { label: "Press her for more details (costs Focus)", to: "lyra_more", effect: (s) => s.focus -= 1 }
                ]
            },

            lyra_more: {
                title: "Details Matter",
                portraitLabel: "The Edge of Fear",
                portraitUrl: "../images/Details Matter.png",
                hint: "More detail can help… but time is dangerous down here.",
                text:
                    `Lyra hesitates. “There’s another thing.”

She lowers her voice. “Agent Thalos has been reassigned. Not a patrol—an execution.
He doesn’t hunt with crowds. He hunts with certainty.”

A chill threads through the air like a held breath.
Lyra taps the hatch twice. “If we linger, the Grid will tell on us.”`,
                choices: [
                    { label: "Move now", to: "grid_entry", effect: (s) => addClue(s, "Clue: Thalos hunts alone") },
                    {
                        label: "Scan for surveillance pings before entering (raises Detection/Pressure)", to: "scan_entry",
                        effect: (s) => { s.focus -= 1; detectionTick(1); pressureTick(1); }
                    }
                ]
            },

            scan_entry: {
                title: "Listening for Eyes",
                portraitLabel: "Cold Signals",
                portraitUrl: "../images/Listening for Eyes.png",
                hint: "Scanning helps you avoid traps but costs time—Detection/Pressure rise.",
                text:
                    `Vear turns his head slightly, as if listening to a thought.

“No,” Lyra whispers. “You can’t *hear* cameras.”

Vear doesn’t answer. He reaches into the air with instinct braided to intellect.
The Grid gives up a pattern: a periodic chirp, repeating every nine seconds.

Lyra blinks. “Okay… that’s not normal.”

“Authority beacon,” Vear says. “Recent.”`,
                choices: [
                    {
                        label: "Mark the beacon rhythm as a clue", to: "grid_entry",
                        effect: (s) => addClue(s, "Clue: Beacon chirp every 9 seconds")
                    },
                    {
                        label: "Attempt to disable the beacon (very risky)", to: "disable_beacon",
                        effect: (s) => { s.focus -= 2; detectionTick(2); pressureTick(2); }
                    }
                ]
            },

            disable_beacon: {
                title: "A Quiet Sabotage",
                portraitLabel: "Wire & Will",
                portraitUrl: "https://picsum.photos/700/700?random=45",
                hint: "High risk, high reward. Failure increases Detection sharply.",
                text: (s) => {
                    const success = (s.focus >= 5);
                    if (success) {
                        setFlag(s, "beacon_disabled");
                        stealthDrop(1);
                        return `Lyra holds her breath while Vear follows the chirp to its source.

He doesn’t fumble. He doesn’t hesitate.
His fingers find a seam in the casing, then a wire that is warm in a way it shouldn’t be.

A soft click.
The chirp dies.

Lyra exhales like she’s been underwater. “Remind me not to underestimate you.”`;
                    } else {
                        s.hp -= 2;
                        detectionTick(3);
                        pressureTick(1);
                        return `Lyra watches Vear feel along the housing.

For a moment, it seems possible—until the beacon pulses hard, like a heartbeat startled awake.
A stinging surge snaps through the casing.

Lyra yanks her hand back. “That was a trap!”

Somewhere in the Grid, something registers your presence.`;
                    }
                },
                choices: [
                    { label: "Move on", to: "grid_entry", effect: () => { } }
                ]
            },

            codex_spider: {
                title: "Codex: Spider Drone",
                portraitLabel: "Authority Microdrone",
                portraitUrl: "../images/The Spider Drone.png",
                hint: "Small enough to hide anywhere. Dangerous in swarms. Often unseen until it’s too late.",
                text:
                    `Officially classified as Authority microdrones, spider drones are compact reconnaissance devices no larger than a human hand.
Designed for infiltration and surveillance, they are often deployed in swarms—each unit mapping, monitoring, and relaying data where larger systems cannot reach.

Their spindly, arachnid-like frames crawl across walls, ceilings, and narrow conduits with unnerving precision.
A glossy central lens records in multiple spectra and can project holograms when required.

Most terrifying: camouflage.
When clinging to high walls or ceilings, a spider drone can mimic texture and shadow—vanishing among stone, metal etchings, and architectural detail.

Fragile alone… overwhelming together.
A web of unseen eyes, spun at the Authority’s command.`,
                choices: [
                    { label: "Return to the Grid", to: "grid_entry", effect: () => { } }
                ]
            },

            codex_seeker: {
                title: "Codex: Seeker Drone",
                portraitLabel: "Airborne Enforcer",
                portraitUrl: "../images/Seeker Drone.png",
                hint: "Silent patrol. Red eye tracking. Talons + beam: suppression or execution.",
                text:
                    `The Seeker Drone is one of the Authority’s most feared instruments of control—an airborne security unit built to patrol, pursue, and suppress with silent efficiency.

Spherical and seamless, its smooth shell conceals hidden mechanisms.
At its center glows a single red eye—an unblinking lens that tracks every movement below.

Beneath the frame: retractable talons, used when physical intervention is required.
Worse: an internal weapon array—some seekers carry a projected blue energy beam capable of stunning or killing depending on Authority command.

They rarely travel alone.
Seekers patrol in coordinated units, communicating silently and shifting positions with eerie synchronicity.
To see the red eye overhead is to feel the Authority watching… without rest or mercy.`,
                choices: [
                    { label: "Return to the Grid", to: "grid_entry", effect: () => { } }
                ]
            },

            grid_entry: {
                title: "Beneath the Civil Grid: Entry Artery",
                portraitLabel: "Beneath the Grid",
                portraitUrl: "../images/Beneath the Grid.png",
                hint: "Pressure = Thalos. Detection = drones. If you’re Spider-Tagged, every move raises Detection.",
                text: (s) => {
                    const thalosLine = s.pressure >= 3
                        ? `\n\nFar above, a faint tremor runs through the pipes—like footsteps translated into metal.\nLyra’s eyes harden. “He’s already moving.”`
                        : `\n\nThe Fringe breathes quietly. For a moment, it almost feels abandoned.`;
                    const droneLine = s.detection >= 5
                        ? `\n\nLyra’s voice tightens. “We’ve been noticed. Keep your heat low. Keep your sound low.”`
                        : ``;
                    const tagLine = hasFlag(s, "spiderTagged")
                        ? `\n\nLyra touches Vear’s sleeve. “We’re tagged. They’re following our signature.”`
                        : ``;

                    return (
                        `The hatch swings open into darkness layered with heat and dust.
Pipes lace the ceiling like frozen lightning. Wires hang in loops, swaying with the ventilation.

Vear steps down first. He cannot see the tunnel—yet he maps it anyway:
air currents, distant hums, the subtle pitch of stressed metal.
Lyra follows, sealing the hatch behind them.

Ahead: three routes.
• LEFT: a maintenance corridor marked “WATER / RECIRC”
• STRAIGHT: a narrow transit duct, crawling space only
• RIGHT: a security stairwell with a dead keypad

Your goal is Node 13—somewhere beyond these arteries.${thalosLine}${droneLine}${tagLine}`
                    );
                },
                choices: (s) => ([
                    {
                        label: "Go LEFT toward recirculation (quiet… maybe too quiet)", to: "recirc_spider",
                        effect: (s) => { s.focus += 1; pressureTick(1); }
                    },
                    {
                        label: "Go STRAIGHT through the transit duct (fast, risky)", to: "duct",
                        effect: (s) => { s.focus -= 1; detectionTick(1); pressureTick(2); }
                    },
                    {
                        label: "Try the RIGHT keypad (solve a lock)", to: "keypad",
                        effect: (s) => { s.focus -= 1; }
                    },
                    {
                        label: "Search for a maintenance cache (tools)", to: "cache",
                        effect: (s) => { s.focus -= 1; detectionTick(1); pressureTick(1); }
                    },
                ])
            },

            cache: {
                title: "Maintenance Cache",
                portraitLabel: "Forgotten Supplies",
                portraitUrl: "../images/Maintenance Cache.png",
                hint: "Tools that help against drones.",
                text:
                    `A loose panel hides a small cache: contraband from someone who ran before you.

Foam padding. Wrapped components. A strip of heat-foil.

Lyra grins. “Whoever hid this… knew.”`,
                choices: [
                    { label: "Take EMP Shard", to: "grid_entry", effect: (s) => addItem(s, "EMP Shard") },
                    { label: "Take Jammer Pulse", to: "grid_entry", effect: (s) => addItem(s, "Jammer Pulse") },
                    {
                        label: "Take Foil Cloak Strip (reduces Detection immediately)", to: "grid_entry",
                        effect: (s) => { addItem(s, "Foil Cloak Strip"); stealthDrop(2); }
                    }
                ]
            },

            recirc_spider: {
                title: "Recirculation Corridor",
                portraitLabel: "Water / Recirc",
                portraitUrl: "../images/Spider Drones on Ceiling.png",
                hint: "Quiet routes aren’t safe. Spider drones like ceilings and shadows.",
                text: (s) => {
                    const warned = hasFlag(s, "spiderWarned");
                    return warned
                        ? `The damp corridor breathes. You do not look up—Lyra does.\n\n“Ceiling line,” she whispers.\nVear stills. The air tastes faintly metallic.\n\nA shape that could be a bolt… isn’t.`
                        : `The air turns damp. Water lines thrum behind the walls.\n\nLyra pauses mid-step.\n“Did you hear that?”\n\nVear tilts his head. “Not sound. Motion.”\n\nAbove you, something clings to the ceiling—camouflaged so perfectly it feels like imagination.`;
                },
                choices: (s) => [
                    {
                        label: "Move slowly, stay under the pipe texture (stealth)", to: "recirc",
                        effect: (s) => { setFlag(s, "spiderWarned"); stealthDrop(1); s.focus -= 1; }
                    },
                    {
                        label: "Throw a pebble to test the ceiling (risky)", to: "spider_swarm",
                        effect: (s) => { setFlag(s, "spiderWarned"); detectionTick(2); pressureTick(1); }
                    },
                    {
                        label: "Ask what spider drones do (codex)", to: "codex_spider",
                        effect: (s) => { s.focus -= 1; detectionTick(1); }
                    }
                ]
            },

            spider_swarm: {
                title: "Spider Drones",
                portraitLabel: "Unseen Web",
                portraitUrl: "../images/The Spider Drone.png",

        // --- Render helpers ---
        function setBar(id, val, max) {
            const pct = Math.round((val / max) * 100);
            document.getElementById(id).style.width = `${pct}%`;
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        // --- Seeker interception logic ---
        function shouldSeekerIntercept(nextNodeId) {
            if (state.detection < 7) return false;
            if (hasFlag(state, "seekerShown")) return false;
            if (nextNodeId === "seeker_patrol" || nextNodeId === "codex_seeker" || nextNodeId === "seeker_stun") return false;
            // Be more likely if Spider-Tagged (swarm relay makes interception easier)
            const bias = hasFlag(state, "spiderTagged") ? 1 : 0;
            return (((state.pressure + state.detection + bias) % 2) === 0);
        }

        // NEW: apply Spider Tag passive detection on every move (until EMP clears it)
        function applySpiderTagPassiveOnMove(nextNodeId) {

            }

            const title = typeof node.title === "function" ? node.title(state) : node.title;
            const hint = typeof node.hint === "function" ? node.hint(state) : node.hint;
            const text = typeof node.text === "function" ? node.text(state) : node.text;
            const choices = typeof node.choices === "function" ? node.choices(state) : node.choices;

            document.getElementById("title").textContent = title;
            document.getElementById("hintBox").textContent = hint || "";
            document.getElementById("text").innerHTML = escapeHtml(text).replaceAll("\n", "<br>");

            // portrait
            const portrait = document.getElementById("portrait");
            const url = node.portraitUrl || "https://picsum.photos/700/700";
            portrait.style.backgroundImage =
                `linear-gradient(135deg, rgba(56,189,248,.22), rgba(99,102,241,.12)), url("${url}")`;
            document.getElementById("portraitLabel").textContent = node.portraitLabel || "";

            // stats + bars
            document.getElementById("hp").textContent = state.hp;
            document.getElementById("focus").textContent = state.focus;
            document.getElementById("pressure").textContent = state.pressure;
            document.getElementById("detect").textContent = state.detection;

            setBar("hpBar", state.hp, 20);
            setBar("focusBar", state.focus, 20);
            setBar("pressureBar", state.pressure, 12);

            cluesEl.innerHTML = "";
            for (const clue of state.clues) {
                const el = document.createElement("span");
                el.className = "pill";
                el.textContent = clue.replace("Clue: ", "");
                cluesEl.appendChild(el);
            }
            document.getElementById("clueCount").textContent = state.clues.length;

            // inventory
            const inv = document.getElementById("inv");
            inv.innerHTML = "";
            for (const item of state.inventory) {
                const el = document.createElement("span");
                el.className = "pill";
                el.textContent = item;
                inv.appendChild(el);
            }
            document.getElementById("invCount").textContent = state.inventory.length;

            // choices UI
            const box = document.getElementById("choices");
            box.innerHTML = "";
            choices.forEach((c) => {
                const btn = document.createElement("button");
                btn.textContent = c.label;
                btn.onclick = () => {
                    if (typeof c.effect === "function") c.effect(state);

                    // Passive tag effect on movement
                    applySpiderTagPassiveOnMove(c.to);

                    // Seeker interception check
                    if (shouldSeekerIntercept(c.to)) {
                        setFlag(state, "seekerShown", true);
                        state.nodeId = "seeker_patrol";
                        render();
                        return;
                    }

                    state.nodeId = c.to;
                    render();
                };
                box.appendChild(btn);
            });

            // log
            const tag = hasFlag(state, "spiderTagged") ? "ON" : "OFF";
            document.getElementById("log").innerHTML =
                `Location: <code>${state.nodeId}</code> · Pressure: <code>${state.pressure}</code> · Detection: <code>${state.detection}</code> · Spider Tag: <code>${tag}</code> · Clues: <code>${state.clues.length}</code>`;
        }

        // --- Save/Load/Reset ---
        const KEY = "vear_civil_grid_save_v3";
        document.getElementById("saveBtn").onclick = () => {
            localStorage.setItem(KEY, JSON.stringify(state));
            alert("Saved!");
        };
        document.getElementById("loadBtn").onclick = () => {
            const raw = localStorage.getItem(KEY);
            if (!raw) return alert("No save found.");
            const loaded = JSON.parse(raw);
            Object.assign(state, loaded);
            if (!state.flags) state.flags = { spiderAlert: false, seekerAlert: false, spiderTagged: false, seekerShown: false, stunned: false };
            clampState();
            render();
            alert("Loaded!");
        };
        document.getElementById("resetBtn").onclick = () => {
            state.nodeId = "prologue";
            state.hp = 10; state.focus = 8; state.pressure = 0; state.detection = 0;
            state.inventory = []; state.clues = [];
            state.flags = { spiderAlert: false, seekerAlert: false, spiderTagged: false, seekerShown: false, stunned: false };
            render();
        };

        render();
    </script>
</body>
</html>
